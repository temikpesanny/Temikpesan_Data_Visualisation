<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Campus Shop</title>
    <script type="module" src="./index.js"></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <h1>University Campus Shop</h1>
    <div class="container">
        <!-- Where our 5 university products will generate as item blocks -->
        <main id="mainContainer" class="mainContainer"></main>

        <!-- Our shopping cart tracking panel -->
        <aside class="asideContainer">
            <h2>Your Shopping Cart</h2>
            <div id="selectedProductsElement" class="cartList">
                <!-- Selected products, quantities, and +/- buttons will generate here -->
            </div>
            <div class="cartTotalRow">
                <span>Total: </span>
                <span id="totalElement">$0</span>
            </div>
        </aside>
    </div>
</body>
</html>
